name: Upload Frontend to S3

on:
  workflow_dispatch:  # run manually from GitHub Actions UI

jobs:
  upload:
    name: Build & Upload to S3
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          VITE_WS_URL: ${{ secrets.VITE_WS_URL }}

      - name: Sync assets to S3 (long-cache)
        run: |
          aws s3 sync frontend/dist/ "s3://${{ secrets.S3_BUCKET_NAME }}/" \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"

      - name: Upload index.html (no-cache)
        run: |
          aws s3 cp frontend/dist/index.html "s3://${{ secrets.S3_BUCKET_NAME }}/index.html" \
            --cache-control "public, max-age=0, must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"

      - name: Summary
        run: |
          echo "### Frontend Uploaded ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "S3 Bucket: \`${{ secrets.S3_BUCKET_NAME }}\`" >> "$GITHUB_STEP_SUMMARY"
