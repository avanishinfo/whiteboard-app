name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options: [production]

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to S3 + CloudFront
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get CloudFormation outputs
        id: cf
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name WhiteboardFrontend \
            --query "Stacks[0].Outputs[?OutputKey=='S3BucketName'].OutputValue" \
            --output text)

          DIST_ID=$(aws cloudformation describe-stacks \
            --stack-name WhiteboardFrontend \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
            --output text)

          CF_URL=$(aws cloudformation describe-stacks \
            --stack-name WhiteboardFrontend \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontUrl'].OutputValue" \
            --output text)

          ALB_DNS=$(aws cloudformation describe-stacks \
            --stack-name WhiteboardBackend \
            --query "Stacks[0].Outputs[?OutputKey=='AlbDnsName'].OutputValue" \
            --output text)

          echo "bucket=$BUCKET"         >> "$GITHUB_OUTPUT"
          echo "dist_id=$DIST_ID"       >> "$GITHUB_OUTPUT"
          echo "cf_url=$CF_URL"         >> "$GITHUB_OUTPUT"
          echo "alb_dns=$ALB_DNS"       >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          VITE_WS_URL: ws://${{ steps.cf.outputs.alb_dns }}

      - name: Sync assets to S3 (long-cache)
        run: |
          aws s3 sync frontend/dist/ "s3://${{ steps.cf.outputs.bucket }}/" \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"

      - name: Upload index.html (no-cache)
        run: |
          aws s3 cp frontend/dist/index.html "s3://${{ steps.cf.outputs.bucket }}/index.html" \
            --cache-control "public, max-age=0, must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CloudFront cache
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "${{ steps.cf.outputs.dist_id }}" \
            --paths "/*" \
            --query "Invalidation.Id" \
            --output text)
          echo "Invalidation ID: $INVALIDATION_ID"

      - name: Summary
        run: |
          echo "### Frontend Deployed ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| URL | ${{ steps.cf.outputs.cf_url }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| S3 Bucket | ${{ steps.cf.outputs.bucket }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| WS Backend | ws://${{ steps.cf.outputs.alb_dns }} |" >> "$GITHUB_STEP_SUMMARY"
