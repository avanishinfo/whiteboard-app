name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options: [production]

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Build Docker image & Deploy to ECS Fargate
    runs-on: ubuntu-latest
    environment: production

    permissions:
      id-token: write   # OIDC auth with AWS
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get CloudFormation outputs
        id: cf
        run: |
          ECR_URI=$(aws cloudformation describe-stacks \
            --stack-name WhiteboardBackend \
            --query "Stacks[0].Outputs[?OutputKey=='EcrRepositoryUri'].OutputValue" \
            --output text)

          CLUSTER=$(aws cloudformation describe-stacks \
            --stack-name WhiteboardBackend \
            --query "Stacks[0].Outputs[?OutputKey=='EcsClusterName'].OutputValue" \
            --output text)

          SERVICE=$(aws cloudformation describe-stacks \
            --stack-name WhiteboardBackend \
            --query "Stacks[0].Outputs[?OutputKey=='EcsServiceName'].OutputValue" \
            --output text)

          echo "ecr_uri=$ECR_URI"   >> "$GITHUB_OUTPUT"
          echo "cluster=$CLUSTER"   >> "$GITHUB_OUTPUT"
          echo "service=$SERVICE"   >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: backend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.cf.outputs.ecr_uri }}:latest
            ${{ steps.cf.outputs.ecr_uri }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster "${{ steps.cf.outputs.cluster }}" \
            --service  "${{ steps.cf.outputs.service }}" \
            --force-new-deployment \
            --output json \
            | jq '.service.deployments[0] | {status, desiredCount, runningCount}'

      - name: Wait for service to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster "${{ steps.cf.outputs.cluster }}" \
            --services "${{ steps.cf.outputs.service }}"
          echo "Service is stable."

      - name: Summary
        run: |
          echo "### Backend Deployed ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | \`${{ steps.cf.outputs.ecr_uri }}:${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ECS Cluster | ${{ steps.cf.outputs.cluster }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ECS Service | ${{ steps.cf.outputs.service }} |" >> "$GITHUB_STEP_SUMMARY"
